name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify dependency locks
        run: ./gradlew :app:dependencies --write-locks

      - name: Check dependency lock is current
        run: git diff --exit-code -- app/gradle.lockfile

      - name: Run unit tests and Android lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: message-atlas-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: message-atlas-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
